{% extends 'base.html' %}
{% load static %}
{% block baseblock %}

<!-- Add the Lottie player script -->
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-6 mx-auto p-2 my-3 text-center"  style="box-shadow:0px 0px 10px gray;">
            <!-- Replace the GIF with the Lottie animation -->
            <lottie-player src="https://assets5.lottiefiles.com/packages/lf20_jbrw3hcz.json"  background="transparent"  speed="1"  style="width: 300px; height: 300px; margin: 0 auto;"  loop autoplay></lottie-player>
            
            <h1 class="alert alert-success">PAYMENT SUCCESSFUL</h1>
            <div class="my-1">
                <a href="{% url 'cart' %}" class="btn btn-success">Continue Shopping</a>
                <a href="{% url 'cust_dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
